name: PRIME repository audit
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  prime-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Test instrument and audit adapters without providers
        run: |
          python3 PRIME_6_7.py --version
          python3 PRIME_6_7.py --self-test
          python3 -m prime_audit.environment --output prime-environment.json
          python3 prime_audit/instrument.py --self-test
          python3 -m unittest discover -s prime_audit/tests -v
      - name: Exercise seven role scenarios and record evidence
        run: python3 -m prime_audit.seven_roles --output prime-seven-role-receipt.json
      - name: Check full-source seven-role audit
        run: |
          printf 'Source says 12 units.\n' > "$RUNNER_TEMP/prime-source.txt"
          printf 'Report says 15 units.\n' > "$RUNNER_TEMP/prime-candidate.txt"
          python3 -m prime_audit.source_chain --source "$RUNNER_TEMP/prime-source.txt" --candidate "$RUNNER_TEMP/prime-candidate.txt" --output prime-source-chain-receipt.json
      - name: Run seven-stage harness fixture chain
        run: python3 -m prime_audit.harness_demo --output prime-harness-demo.json
      - name: Simulate operation plan and record changed-file evidence
        run: python3 -m prime_audit.ci --event "$GITHUB_EVENT_PATH" --output prime-audit-receipt.json
      - name: Preserve audit receipt for review
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: prime-audit-receipt
          path: |
            prime-audit-receipt.json
            prime-environment.json
            prime-seven-role-receipt.json
            prime-harness-demo.json
            prime-source-chain-receipt.json
          retention-days: 7
          if-no-files-found: ignore
