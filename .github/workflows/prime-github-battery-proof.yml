name: PRIME battery evidence proof
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  deterministic-battery:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Execute complete current PRIME text instrument and evidence ledgers
        run: PYTHONPATH=. python demonstrations/github-battery/run_battery.py
      - name: Upload controlled inputs, calculations, and outputs
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: prime-battery-proof
          path: |
            battery-results.json
            demonstrations/github-battery/
