name: Wabi-directed Vibe and ChainGPT review

on:
  # Provider-free CI runs on install/update and can be manually re-run.
  push:
    branches: [main]
    paths:
      - '.github/workflows/wabi-vibe-chaingpt.yml'
      - 'integrations/wabi-vibe-chaingpt/**'
  workflow_dispatch:
  issue_comment:
    types: [created]

permissions:
  contents: read

jobs:
  verify:
    # Public-safe CI only; never receives provider secrets or task content.
    if: github.event_name != 'issue_comment'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Set up Python 3.12
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - name: Run Chassis v7 and scaffold tests
        working-directory: integrations/wabi-vibe-chaingpt
        run: |
          python3 -m pip install --disable-pip-version-check --no-input pytest==8.3.5
          python3 -m pytest -q test_thaumaturgicon_chassis_v7.py
          python3 -m unittest discover -s tests -v

  review:
    # The issue body is data only. Run only in a private repository, on a
    # top-level issue (never a PR), from the owner's account, for the command.
    if: >-
      github.event_name == 'issue_comment' &&
      github.event.repository.private == true &&
      github.event.issue.pull_request == null &&
      github.event.comment.user.login == 'socio-sapien' &&
      startsWith(github.event.comment.body, '/wabi ai ')
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Check out default-branch workflow source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Python 3.12
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'

      - name: Validate request and required Mistral secret presence
        env:
          MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
        run: |
          cd integrations/wabi-vibe-chaingpt
          python3 scripts/prepare_task.py \
            --event "$GITHUB_EVENT_PATH" \
            --request-out "$RUNNER_TEMP/wabi-request.json" \
            --vibe-prompt-out "$RUNNER_TEMP/vibe-prompt.md"
          if [ -z "${MISTRAL_API_KEY:-}" ]; then
            echo 'Missing repository Actions secret MISTRAL_API_KEY.' >&2
            exit 2
          fi

      - name: Run the Chassis v7 suite and local scaffold tests
        run: |
          cd integrations/wabi-vibe-chaingpt
          python3 -m pip install --disable-pip-version-check --no-input pytest==8.3.5
          python3 -m pytest -q test_thaumaturgicon_chassis_v7.py
          python3 -m unittest discover -s tests -v

      - name: Install uv and pinned Mistral Vibe CLI
        run: |
          python3 -m pip install --disable-pip-version-check --no-input uv
          uv tool install mistral-vibe==3.0.3
          echo "$(uv tool dir --bin)" >> "$GITHUB_PATH"

      - name: Run Mistral Vibe without repository tools
        env:
          MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
          VIBE_HOME: ${{ runner.temp }}/vibe-home
        run: |
          mkdir -p "$VIBE_HOME" "$RUNNER_TEMP/vibe-work"
          cat > "$VIBE_HOME/config.toml" <<'TOML'
          default_agent = "ask"
          enable_mcp = false
          enable_connectors = false
          enable_auto_approve = false
          enable_subagents = false
          enable_background_processes = false
          enable_telemetry = false
          TOML
          cd "$RUNNER_TEMP/vibe-work"
          vibe --agent ask \
            --prompt-file "$RUNNER_TEMP/vibe-prompt.md" \
            --max-turns 1 --max-tokens 1600 --time-limit 90 \
            --output text --enabled-tools 're:^$' --disabled-tools '*' \
            > "$RUNNER_TEMP/mistral-output.txt"
          test -s "$RUNNER_TEMP/mistral-output.txt"

      - name: Ask ChainGPT to review the Vibe answer (explicitly enabled only)
        if: vars.WABI_ENABLE_CHAINGPT == 'true'
        env:
          CHAINGPT_API_KEY: ${{ secrets.CHAINGPT_API_KEY }}
        run: |
          if [ -z "${CHAINGPT_API_KEY:-}" ]; then
            echo 'WABI_ENABLE_CHAINGPT is true but repository Actions secret CHAINGPT_API_KEY is missing.' >&2
            exit 2
          fi
          cd integrations/wabi-vibe-chaingpt
          python3 scripts/chaingpt_review.py \
            --request "$RUNNER_TEMP/wabi-request.json" \
            --vibe-output "$RUNNER_TEMP/mistral-output.txt" \
            --output "$RUNNER_TEMP/chaingpt-output.txt"

      - name: Record that ChainGPT was not invoked
        if: vars.WABI_ENABLE_CHAINGPT != 'true'
        run: |
          printf '%s\n' 'CHAIN_GPT_SKIPPED: Set repository Actions variable WABI_ENABLE_CHAINGPT=true after reviewing owner-side credentials, credits, and billing.' > "$RUNNER_TEMP/chaingpt-output.txt"

      - name: Run Chassis v7 lexical audits on the three text inputs/outputs
        run: |
          cd integrations/wabi-vibe-chaingpt
          python3 scripts/run_chassis.py \
            --request "$RUNNER_TEMP/wabi-request.json" \
            --vibe-output "$RUNNER_TEMP/mistral-output.txt" \
            --chaingpt-output "$RUNNER_TEMP/chaingpt-output.txt" \
            --output "$RUNNER_TEMP/chassis-audit.json" \
            --db "$RUNNER_TEMP/chassis.sqlite3"

      - name: Publish private run artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: wabi-vibe-chaingpt-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/wabi-request.json
            ${{ runner.temp }}/mistral-output.txt
            ${{ runner.temp }}/chaingpt-output.txt
            ${{ runner.temp }}/chassis-audit.json
          retention-days: 7
