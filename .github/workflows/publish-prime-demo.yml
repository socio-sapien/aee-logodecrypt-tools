name: Publish PRIME demonstration
on:
  push:
    branches: [main]
    paths:
      - 'prime/demo-environment/**'
      - 'prime/aee_logodecrypt_prime.py'
      - '.github/workflows/publish-prime-demo.yml'
  pull_request:
    paths:
      - 'prime/demo-environment/**'
      - 'prime/aee_logodecrypt_prime.py'
      - '.github/workflows/publish-prime-demo.yml'
  workflow_dispatch:
permissions:
  contents: read
  pages: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Recompute and verify committed demonstration
        run: |
          python3 prime/demo-environment/build_demo.py --check
          python3 prime/aee_logodecrypt_prime.py --self-test
      - name: Exercise the browser experience
        run: |
          python3 -m pip install playwright==1.58.0
          python3 -m playwright install --with-deps chromium
          python3 prime/demo-environment/test_browser.py
      - name: Assemble static site
        run: |
          mkdir -p _site/prime/demo-environment
          cp -R prime/demo-environment/. _site/prime/demo-environment/
          cp prime/aee_logodecrypt_prime.py _site/prime/aee_logodecrypt_prime.py
          cp prime/README.md _site/prime/README.md
          touch _site/.nojekyll
          cat > _site/index.html <<'HTML'
          <!doctype html>
          <html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
          <meta http-equiv="refresh" content="0; url=prime/demo-environment/lab.html">
          <title>PRIME demonstration</title>
          <body style="margin:3rem;background:#0b1118;color:#eaf0eb;font:18px system-ui">
          <p>Opening the <a style="color:#90f0c5" href="prime/demo-environment/lab.html">PRIME evidence-under-pressure demonstration</a>…</p>
          </body></html>
          HTML
      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: _site
  publish:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
