name: Copilot setup steps
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  copilot-setup-steps:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Verify installed full PRIME battery
        run: |
          python3 PRIME_6_7.py --version
          python3 PRIME_6_7.py --self-test
          python3 -m prime_audit.environment --output "$RUNNER_TEMP/prime-environment.json"
      - name: Verify secret-free PRIME tools
        run: python3 -m unittest discover -s prime_audit/tests -v
