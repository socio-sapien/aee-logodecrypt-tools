name: Reconcile PRIME role index
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: prime-role-index-${{ github.ref }}
  cancel-in-progress: false
jobs:
  reconcile:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Reconcile and verify derived role index
        run: |
          python3 -m prime_audit.role_index_repair
          python3 -m unittest discover -s prime_audit/tests -v
      - name: Commit verified index if changed
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if git diff --quiet -- .prime/role-index.json; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- .prime/role-index.json
          git commit -m 'Reconcile generated PRIME role index'
          gh auth setup-git
          git push origin HEAD:main
      - name: Preserve repair receipt
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: prime-role-repair-receipt
          path: prime-role-repair-receipt.json
          if-no-files-found: ignore
